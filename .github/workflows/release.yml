name: Release Headroom

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Test, Sign, Notarize & Publish macOS Release
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify Swift toolchain
        run: swift --version

      - name: Run unit tests
        run: swift test

      - name: Import Apple Developer ID certificate (if configured)
        id: signing
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-headroom-ci
        run: |
          if [ -z "$APPLE_CERT_BASE64" ] || [ -z "$APPLE_CERT_PASSWORD" ]; then
            echo "No Apple Developer ID secrets configured; building with ad-hoc signature."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/dev_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/headroom-signing.keychain-db"

          echo -n "$APPLE_CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in APPLE_CERT_BASE64."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Imported signing identity: $IDENTITY"
          rm -f "$CERT_PATH"

      - name: Compute next release version
        id: version
        shell: bash
        run: |
          BASE_VER="$(tr -d '[:space:]' < VERSION)"
          MAJOR_MINOR="$(echo "$BASE_VER" | awk -F. '{print $1 "." $2}')"
          BASE_PATCH="$(echo "$BASE_VER" | awk -F. '{print ($3 == "" ? 0 : $3)}')"

          EXISTING_TAGS="$(git tag -l "v${MAJOR_MINOR}.*" | sed "s/^v${MAJOR_MINOR}\.//" | grep -E '^[0-9]+$' | sort -n || true)"
          if [ -z "$EXISTING_TAGS" ]; then
            NEXT_PATCH="$BASE_PATCH"
          else
            HIGHEST="$(echo "$EXISTING_TAGS" | tail -n 1)"
            if [ "$HIGHEST" -ge "$BASE_PATCH" ]; then
              NEXT_PATCH=$((HIGHEST + 1))
            else
              NEXT_PATCH="$BASE_PATCH"
            fi
          fi

          VERSION="${MAJOR_MINOR}.${NEXT_PATCH}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed release version: ${TAG}"

      - name: Build, sign, notarize & package Headroom.app, DMG, and CLI
        env:
          HEADROOM_VERSION: ${{ steps.version.outputs.version }}
          HEADROOM_BUILD_NUMBER: ${{ github.run_number }}
          HEADROOM_CREATE_ARCHIVES: "1"
          HEADROOM_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$HEADROOM_SIGN_IDENTITY" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            export HEADROOM_NOTARIZE="1"
          else
            export HEADROOM_NOTARIZE="0"
          fi
          chmod +x scripts/bundle-app.sh
          ./scripts/bundle-app.sh
          ls -lh dist/

      - name: Smoke-test release CLI
        run: |
          .build/release/headroom --version
          .build/release/headroom status --demo
          .build/release/headroom pools --demo --json > /dev/null

      - name: Clean up temporary CI keychain
        if: always() && steps.signing.outputs.identity != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/headroom-signing.keychain-db" || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          {
            echo "## What's New in Headroom ${TAG}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              COMMITS="$(git log --no-merges --pretty=format:'- %s' "${PREV_TAG}..HEAD")"
            else
              COMMITS="$(git log --no-merges --pretty=format:'- %s' -n 10)"
            fi
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
            else
              echo "- Maintenance release and stability improvements."
            fi
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > "$NOTES_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Headroom ${TAG}"
          git push origin "$TAG"

          ASSETS=(
            dist/Headroom-v${VERSION}-macos-*.zip
            dist/headroom-cli-v${VERSION}-macos-*.tar.gz
            dist/SHA256SUMS.txt
          )
          for dmg in dist/Headroom-v${VERSION}-macos-*.dmg; do
            if [ -f "$dmg" ]; then
              ASSETS+=("$dmg")
            fi
          done

          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --title "Headroom ${TAG}" \
            --notes-file "$NOTES_FILE" \
            --latest
